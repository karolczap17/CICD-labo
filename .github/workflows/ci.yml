name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: code ophalen
        uses: actions/checkout@v7

      - name: installeer node
        uses: actions/setup-node@v7
        with: 
          node-version: 24

      - name: tests uitvoeren
        run: npm test
      
